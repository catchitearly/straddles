name: Straddle Dashboard

on:
  schedule:
    - cron: "05 10 * * 1-5"   # 3:35 PM IST on weekdays
  workflow_dispatch:            # Manual trigger from Actions UI

jobs:
  run-dashboard:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install fyers-apiv3 pandas plotly

      - name: Run Straddle Script
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
        run: |
          python straddle.py

      - name: List output folder (debug)
        if: always()
        run: |
          echo "=== Files in output/ ==="
          ls -lh output/ || echo "output/ folder is missing or empty"

      - name: Upload Dashboard HTML as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: straddle-dashboard-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit and Push HTML to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only commit if there are actual files in output/
          if [ -d "output" ] && [ "$(ls -A output/)" ]; then
            git add output/
            git diff --cached --quiet && echo "No changes to commit" || \
              git commit -m "straddle dashboard $(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M IST')" && git push
          else
            echo "No HTML files found in output/ — skipping commit"
          fi
