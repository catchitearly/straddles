name: Straddle Dashboard

on:
 
  workflow_dispatch:

jobs:
  run-dashboard:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install fyers-apiv3 pandas plotly

      - name: Run Straddle Script
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
        run: |
          python straddle.py

      - name: List output folder (debug)
        if: always()
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== All files in workspace ==="
          find . -not -path './.git/*' -type f
          echo "=== output/ contents ==="
          ls -lh output/ 2>/dev/null || echo "output/ folder missing or empty"

      - name: Upload Dashboard HTML as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: straddle-dashboard-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit and Push HTML to Repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d "output" ] && [ "$(ls -A output/ 2>/dev/null)" ]; then
            git add output/
            git diff --cached --quiet \
              && echo "No changes to commit" \
              || (git commit -m "straddle dashboard $(TZ='Asia/Kolkata' date +'%Y-%m-%d %H:%M IST')" && git push)
          else
            echo "output/ is empty or missing — nothing to commit"
          fi
