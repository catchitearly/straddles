name: Straddle Analyzer Runner

on:
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
  
  # Backup schedule (every 5 minutes)
  #schedule:
    #- cron: '*/5 * * * *'

# Permissions needed for GitHub Pages
permissions:
  contents: write
  pages: write

jobs:
  run-straddle-analyzer:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install fyers-apiv3 pandas plotly scipy
    
    - name: Create output directory
      run: |
        mkdir -p output
        mkdir -p docs  # For GitHub Pages
    
    - name: Run straddle analyzer
      env:
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python straddle_analyzer.py
    
    - name: Update latest dashboard
      run: |
        # Find the latest HTML file
        LATEST=$(ls -t output/*.html | head -1)
        if [ -f "$LATEST" ]; then
          # Copy to index.html for GitHub Pages
          cp "$LATEST" docs/index.html
          echo "Updated dashboard with $LATEST"
        else
          echo "No dashboard files found!"
          exit 1
        fi
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/index.html output/
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update dashboard [skip ci]"
        git push
