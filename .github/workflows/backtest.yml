name: Straddle Backtest Simulator
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas fyers-apiv3 pytz

      - name: Run Backtester
        run: python backtest.py

      - name: Commit Cache
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          mkdir -p data_cache
          git add data_cache/*.csv
          git commit -m "Update cache [skip ci]" || echo "No changes"
          git push

      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: simulator
          path: simulator.html
